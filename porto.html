    <style>
        /* =========================================
           1. PENGATURAN LATAR BELAKANG
           ========================================= */
        body {
            background-color: #8e9bb1; 
            margin: 0;
            padding: 20px 50px; 
            font-family: 'Montserrat', sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* =========================================
           2. PENGATURAN KOTAK PUTIH (CONTAINER)
           ========================================= */
        .container {
            background-color: #ffffff;
            width: 70%;
            max-width: 750px; /* Lebarnya dibuat pas agar proporsional */
            padding: 40px 80px 60px 80px; /* Jarak aman dalam kotak (Kiri-Kanan cukup luas) */
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
            box-sizing: border-box;
            text-align: left; /* Teks default rata kiri */
        }

        /* =========================================
           3. PENGATURAN JUDUL KATEGORI
           ========================================= */
        .category-title {
            color: #1D357F; /* Biru gelap */
            font-size: 20px;
            font-weight: 700; /* Tebal */
            margin-top: 20px; /* Jarak atas dari bagian sebelumnya */
            margin-bottom: 20px; /* Jarak bawah ke link pertama */
            text-transform: uppercase; /* Huruf kapital semua otomatis */
            letter-spacing: 0.5px;
        }

        /* Menghilangkan jarak atas khusus untuk judul yang posisinya paling pertama */
        .category-title:first-child {
            margin-top: 0;
        }

        /* =========================================
           4. PENGATURAN LINK PORTOFOLIO
           ========================================= */
        .porto-link {
            display: block; /* Agar setiap link otomatis turun ke baris baru */
            color: #1D357F; /* Warna biru sedikit pudar */
            font-size: 15.5px;
            text-decoration: underline; /* Garis bawah khas link */
            margin-bottom: 18px; /* Jarak antar link diubah agar lebih lega */
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .porto-link:hover {
            color: #1a2b6d; /* Warna link menggelap saat disentuh kursor */
        }

        /* =========================================
           5. PENGATURAN TOMBOL KEMBALI
           ========================================= */
        .back-icon {
            display: block;
            text-align: center; /* Ikon panah dipaksa rata tengah */
            margin-top: 40px; /* Jarak dari link terakhir ke ikon panah */
        }

        .back-icon a {
            color: #1D357F; 
            font-size: 20px; 
            text-decoration: none;
            transition: color 0.3s ease, transform 0.2s ease;
            display: inline-block;
        }

        .back-icon a:hover {
            color: #1a2b6d; 
            transform: translateX(-5px); /* Animasi geser kiri sedikit saat di-hover */
        }

        /* Penyesuaian untuk layar HP agar teks tidak terlalu mepet ke ujung layar */
        @media (max-width: 600px) {
            .container {
                padding: 50px 40px; 
            }
            .category-title {
                font-size: 18px;
            }
        }
        /* =========================================
           PENGATURAN KHUSUS UNTUK LAYAR HP
           ========================================= */
        @media (max-width: 600px) {
            body {
                padding: 40px 15px; /* Mengurangi jarak di luar kotak putih */
            }
            .container {
                width: 100%;
                padding: 40px 25px; /* Melebarkan area teks di dalam kotak */
            }
            .category-title {
                font-size: 18px; /* Menyesuaikan ukuran judul agar tidak terpotong panjang */
            }
        }
    </style>
</head>
