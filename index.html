<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomalus Project</title>
    
    <!-- Google Fonts: Import Montserrat dan Agbalumo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome versi 6.5.1 terbaru -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Latar belakang layar penuh */
        body {
            background-color: #939fb5; 
            margin: 0;
            padding: 40px 20px; 
            font-family: 'Montserrat', sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* CONTAINER UTAMA (KOTAK PUTIH) */
        .container {
            background-color: #ffffff;
            width: 100%;
            /* KUNCI: Lebar maksimal dikecilkan agar seukuran Carrd (Sempit namun pas) */
            max-width: 550px; 
            
            /* Jarak dalam kotak: Atas 60, Kanan/Kiri 45, Bawah 40 */
            padding: 60px 45px 40px 45px; 
            
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            border-radius: 8px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* LOGO */
        .logo {
            width: 100%;
            /* KUNCI: Logo dibuat mendominasi lebar kotak putih */
            max-width: 85%; 
            height: auto;
            margin-bottom: 45px; 
        }

        /* TOMBOL (BUTTONS) */
        .button {
            display: block;
            /* KUNCI: Lebar tombol dipaksa 100% membentang memenuhi kotak */
            width: 100%; 
            box-sizing: border-box;
            
            background-color: #d7d8dc; 
            color: #2f447a; 
            padding: 16px 20px;
            margin-bottom: 18px; 
            text-decoration: none; 
            text-align: center; /* Teks dipastikan di tengah */
            border-radius: 30px; /* Bentuk kapsul/oval sempurna */
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        /* Efek hover tombol */
        .button:hover {
            background-color: #c2c4c9; 
            transform: scale(1.02); 
        }

        /* FOOTER (BAGIAN BAWAH) */
        .footer {
            margin-top: 30px;
            color: #1D357F;
            text-align: center;
        }

        /* Teks "Find Us Here:" */
        .find-us {
            font-family: 'Agbalumo', system-ui;
            font-size: 26px; 
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: normal; 
        }

        /* Ikon Media Sosial */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px; 
            font-size: 32px; 
        }

        .social-icons a {
            color: #1D357F;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #1a2a5a; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="logo.png" alt="Anomalus Project Logo" class="logo">
        
        <!-- Tombol-tombol -->
        <a href="#" class="button">About Anomalus Project</a>
        <a href="#" class="button">RULES</a>
        <a href="#" class="button">What We've Done So Far</a>
        <a href="#" class="button">Get To Know VERSA</a>
        <a href="#" class="button">FAQ</a>

        <!-- Footer -->
        <div class="footer">
            <p class="find-us">Find Us Here:</p>
            <div class="social-icons">
                <a href="https://discord.gg/9WRfV4uVv8" title="Discord"><i class="fab fa-discord"></i></a>
                <a href="https://www.instagram.com/anomalusproject" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@anomalusproject" title="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://x.com/AnomalusProject" title="X"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </div>

</body>
</html>
