<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomalus Project</title>
    <!-- Tambahkan link ke library ikon jika diperlukan, contoh: Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Mengatur latar belakang layar penuh (abu-abu kebiruan) */
        body {
            background-color: #939fb5; 
            margin: 0;
            /* Berikan padding atas dan bawah sebesar 40px pada body */
            padding: 40px 20px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box; /* Memastikan padding tidak merusak ukuran layar */
        }

        /* 2. UBAH BAGIAN CONTAINER */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px; 
            padding: 40px 40px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            text-align: center;
            border-radius: 0px; 
            /* Hapus atau jangan gunakan min-height: 100vh di sini agar kotaknya tidak dipaksa meninggi semata kaki */
        }
        /* Mengatur logo */
        .logo {
            width: 100%;
            max-width: 300px; /* Sesuaikan ukuran logo */
            height: auto;
            margin-bottom: 40px; /* Jarak antara logo dan tombol pertama */
        }

        /* Mengatur desain tombol (Button) */
        .button {
            display: block;
            width: 100%;
            max-width: 320px; /* Lebar tombol */
            background-color: #d7d8dc; /* Warna abu-abu terang tombol */
            color: #2f447a; /* Warna teks biru gelap/ungu */
            padding: 16px 20px;
            margin: 0 auto 18px auto; /* Jarak antar tombol dan tengahkan */
            text-decoration: none; /* Menghilangkan garis bawah pada link */
            border-radius: 5px; /* Membuat ujung tombol membulat (pill shape) */
            font-size: 21px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        /* Efek saat tombol disentuh (Hover/Klik) */
        .button:hover {
            background-color: #c2c4c9; /* Warna tombol sedikit menggelap saat di-hover */
            transform: scale(1.02); /* Membesar sedikit untuk efek interaktif */
        }

        /* Bagian bawah */
        .footer {
            margin-top: 40px;
            color: #2f447a;
        }

        .find-us {
            font-weight: bold;
            font-style: italic;
            margin-bottom: 15px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px; /* Jarak antar ikon */
            font-size: 24px;
        }

        .social-icons a {
            color: #2f447a;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #1a2a5a; /* Warna ikon saat di-hover */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ganti 'logo.png' dengan nama file logo kamu yang ada di GitHub -->
        <img src="logo.png" alt="Anomalus Project Logo" class="logo">
        
        <!-- Ganti '#' dengan link tujuan masing-masing tombol -->
        <a href="#" class="button">About Anomalus Project</a>
        <a href="#" class="button">RULES</a>
        <a href="#" class="button">What We've Done So Far</a>
        <a href="#" class="button">Get To Know VERSA</a>
        <a href="#" class="button">FAQ</a>

        <!-- Bagian bawah -->
        <div class="footer">
            <p class="find-us">Find Us Here:</p>
            <div class="social-icons">
                <!-- Ganti '#' dengan link media sosial Anda -->
                <a href="https://discord.gg/9WRfV4uVv8" title="Discord"><i class="fab fa-discord"></i></a>
                <a href="https://www.instagram.com/anomalusproject" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="www.tiktok.com/@anomalusproject" title="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://x.com/AnomalusProject" title="Twitter / X"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </div>

</body>
</html>
